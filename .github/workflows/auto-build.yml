name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: contains(github.event.head_commit.message, '!release') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Bump version
        id: bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION_INPUT: ${{ github.event.inputs.version_type }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_TYPE="${VERSION_INPUT:-patch}"
          else
            RELEASE_TYPE=$(echo "$COMMIT_MSG" | grep -oP '!release:\s*\K(major|minor|patch)' || echo "patch")
          fi

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          LAST_TAG=$(git tag --sort=-v:refname | head -n1)
          LAST_VERSION=${LAST_TAG#v}
          LAST_VERSION=${LAST_VERSION:-0.0.0}

          cd desktop
          npm version "$LAST_VERSION" --no-git-tag-version --allow-same-version
          npm version "$RELEASE_TYPE" --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          cd ..

          sed -i "s/\"version\": \".*\"/\"version\": \"$NEW_VERSION\"/" desktop/src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" desktop/src-tauri/Cargo.toml

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          if ! git diff --quiet; then
            git add desktop/package.json desktop/src-tauri/tauri.conf.json desktop/src-tauri/Cargo.toml
            git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    env:
      HAS_INTERNAL_PAT: ${{ secrets.INTERNAL_PAT != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && vars.TAURI_UPDATER_PUBKEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
            target: ""
            triple: x86_64-unknown-linux-gnu
            job_name: linux-amd64
          - platform: ubuntu-22.04-arm
            args: ""
            target: ""
            triple: aarch64-unknown-linux-gnu
            job_name: linux-arm64
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
            triple: aarch64-apple-darwin
            job_name: macos-arm64
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin
            triple: x86_64-apple-darwin
            job_name: macos-amd64
          - platform: windows-latest
            args: ""
            target: ""
            triple: x86_64-pc-windows-msvc
            job_name: windows-amd64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Restore target
        uses: ./.github/actions/ghcr-cache
        with:
          mode: restore
          triple: ${{ matrix.triple }}

      - name: Mtimes
        shell: bash
        run: bash scripts/ci-mtime.sh restore

      - name: Install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libasound2-dev protobuf-compiler cmake clang libclang-dev pkg-config

      - name: Install dependencies (macos only)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install autoconf automake libtool protobuf

      - name: Install protoc and nasm (windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $protoc = "$env:RUNNER_TEMP\protoc"
          Invoke-WebRequest -Uri https://github.com/protocolbuffers/protobuf/releases/download/v33.1/protoc-33.1-win64.zip -OutFile "$protoc.zip"
          Expand-Archive "$protoc.zip" -DestinationPath $protoc
          Add-Content $env:GITHUB_PATH "$protoc\bin"
          choco install nasm -y --no-progress

      - name: Checkout internal repo (when PAT present)
        if: ${{ env.HAS_INTERNAL_PAT == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/SoundCloud-Internal
          token: ${{ secrets.INTERNAL_PAT }}
          path: _internal
          sparse-checkout: |
            call
            decrypt-client

      - name: Replace mock crates with real (unix)
        if: ${{ env.HAS_INTERNAL_PAT == 'true' && runner.os != 'Windows' }}
        run: |
          rm -rf utils/call utils/decrypt-client
          cp -r _internal/call ./utils/call
          cp -r _internal/decrypt-client ./utils/decrypt-client

      - name: Replace mock crates with real (windows)
        if: ${{ env.HAS_INTERNAL_PAT == 'true' && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force utils/call
          Remove-Item -Recurse -Force utils/decrypt-client
          Copy-Item -Recurse _internal/call ./utils/call
          Copy-Item -Recurse _internal/decrypt-client ./utils/decrypt-client

      - name: Set cross-compilation environment for macOS x86_64
        if: matrix.job_name == 'macos-amd64'
        run: |
          cat >> "$GITHUB_ENV" <<EOF
          CFLAGS=-arch x86_64
          CXXFLAGS=-arch x86_64
          LDFLAGS=-arch x86_64
          CC_x86_64_apple_darwin=clang
          CXX_x86_64_apple_darwin=clang++
          CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER=clang
          MACOSX_DEPLOYMENT_TARGET=10.13
          EOF

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Rust
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bash scripts/ci-toolchain.sh
          if [ -n "$TARGET" ]; then rustup target add "$TARGET"; fi

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.job_name }}
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Prepare updater config
        if: ${{ env.HAS_UPDATER_KEY == 'true' }}
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: node .github/scripts/updater-manifest.mjs config desktop/src-tauri/tauri.updater.conf.json

      - name: Build Tauri
        id: build
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          UPDATER_CONFIG: ${{ env.HAS_UPDATER_KEY == 'true' && format('{0}/desktop/src-tauri/tauri.updater.conf.json', github.workspace) || '' }}
        run: pnpm tauri build ${{ matrix.args }} ${UPDATER_CONFIG:+--config "$UPDATER_CONFIG"}

      - name: Stamp
        if: always()
        shell: bash
        env:
          BUILD: ${{ steps.build.outcome }}
        run: bash scripts/ci-mtime.sh stamp "$BUILD"

      - name: Check CRT imports (windows only)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          python -m pip install --quiet pefile
          python .github/scripts/crt-imports.py desktop/src-tauri/target/release/soundcloud-desktop.exe

      - name: Create portable exe (windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "desktop/src-tauri/target/release/soundcloud-desktop.exe" -ErrorAction Stop
          $dest = "desktop/src-tauri/target/release/bundle/portable"
          New-Item -ItemType Directory -Force -Path $dest
          Copy-Item $exe.FullName "$dest/soundcloud-desktop-portable.exe"

      - name: Pack source maps
        if: matrix.job_name == 'linux-amd64'
        run: tar -czf web-sourcemaps.tar.gz -C desktop dist-maps

      - name: Upload source maps
        if: matrix.job_name == 'linux-amd64'
        uses: actions/upload-artifact@v7
        with:
          name: web-sourcemaps
          path: web-sourcemaps.tar.gz
          retention-days: 2

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tauri-builds-${{ matrix.job_name }}
          path: |
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
            desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/src-tauri/target/**/release/bundle/portable/*.exe
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/macos/*.tar.gz
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe.sig
            desktop/src-tauri/target/**/release/bundle/msi/*.msi.sig
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage.sig
            desktop/src-tauri/target/**/release/bundle/macos/*.tar.gz.sig
          retention-days: 2

      - name: Save target
        if: success() && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ghcr-cache
        with:
          mode: save
          triple: ${{ matrix.triple }}

  flatpak:
    needs: version
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    env:
      HAS_INTERNAL_PAT: ${{ secrets.INTERNAL_PAT != '' }}
      HAS_FLATPAK_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY != '' }}
      FLATPAK_APP_ID: io.github.zxcloli666.SoundcloudDesktop
      FLATPAK_SITE_URL: ${{ vars.FLATPAK_SITE_URL || format('https://{0}.github.io/{1}/flatpak', github.repository_owner, github.event.repository.name) }}
    outputs:
      repo: ${{ steps.bundle.outputs.repo }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Checkout internal repo (when PAT present)
        if: ${{ env.HAS_INTERNAL_PAT == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/SoundCloud-Internal
          token: ${{ secrets.INTERNAL_PAT }}
          path: _internal
          sparse-checkout: |
            call
            decrypt-client

      - name: Replace mock crates with real
        if: ${{ env.HAS_INTERNAL_PAT == 'true' }}
        run: |
          rm -rf utils/call utils/decrypt-client
          cp -r _internal/call ./utils/call
          cp -r _internal/decrypt-client ./utils/decrypt-client
          rm -rf _internal
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          RUSTUP_TOOLCHAIN=stable "$HOME/.cargo/bin/cargo" metadata --format-version 1 --manifest-path desktop/src-tauri/Cargo.toml > /dev/null

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install flatpak-builder-tools
        run: |
          git clone --depth=1 https://github.com/flatpak/flatpak-builder-tools.git /tmp/fbt
          pip3 install --root-user-action=ignore --break-system-packages --prefix=/app tomlkit
          pip3 install --root-user-action=ignore --break-system-packages --prefix=/app /tmp/fbt/node

      - name: Generate offline sources
        run: |
          cd desktop && npm install --package-lock-only --legacy-peer-deps && cd ..
          flatpak-node-generator npm desktop/package-lock.json -o .github/flatpak/node-sources.json
          python3 /tmp/fbt/cargo/flatpak-cargo-generator.py desktop/src-tauri/Cargo.lock -o .github/flatpak/cargo-sources.json

      - name: Fetch Flathub shared-modules
        run: git clone --depth=1 https://github.com/flathub/shared-modules.git .github/flatpak/shared-modules

      - name: Import repository signing key
        id: gpg
        if: ${{ env.HAS_FLATPAK_KEY == 'true' }}
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: .github/flatpak/io.github.zxcloli666.SoundcloudDesktop.yml
          repo-dir: repo
          build-bundle: false
          upload-artifact: false
          gpg-sign: ${{ steps.gpg.outputs.fingerprint }}

      - name: Bundle and update repository
        id: bundle
        env:
          GPG_FPR: ${{ steps.gpg.outputs.fingerprint }}
        run: bash .github/scripts/flatpak-repo.sh repo flatpak-site

      - name: Upload Flatpak
        uses: actions/upload-artifact@v7
        with:
          name: linux-flatpak
          path: soundcloud-desktop.flatpak

      - name: Upload Flatpak repository
        if: ${{ steps.bundle.outputs.repo == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-repo
          path: flatpak-site
          retention-days: 14

  release:
    needs: [version, build, flatpak]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.published.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: /tmp/artifacts
          pattern: '{tauri-builds-*,linux-flatpak,soundcloud-desktop-*.flatpak,web-sourcemaps}'
          merge-multiple: true

      - name: Flatten and deduplicate artifacts
        run: |
          mkdir -p /tmp/release
          find /tmp/artifacts -type f | while read -r f; do
            name=$(basename "$f")
            case "$f" in
              *aarch64-apple-darwin*.app.tar.gz) name="${name%.app.tar.gz}_arm64.app.tar.gz" ;;
              *x86_64-apple-darwin*.app.tar.gz)  name="${name%.app.tar.gz}_x64.app.tar.gz" ;;
              *aarch64-apple-darwin*.app.tar.gz.sig) name="${name%.app.tar.gz.sig}_arm64.app.tar.gz.sig" ;;
              *x86_64-apple-darwin*.app.tar.gz.sig)  name="${name%.app.tar.gz.sig}_x64.app.tar.gz.sig" ;;
            esac
            cp "$f" "/tmp/release/$name"
          done
          ls -la /tmp/release/

      - name: Build updater manifest
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          node .github/scripts/updater-manifest.mjs manifest /tmp/release "$V"
          rm -f /tmp/release/*.sig

      - name: Add version-less aliases
        working-directory: /tmp/release
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          for file in *"$V"*; do
            alias=$(printf '%s' "$file" | sed -e "s/_${V}_/_/" -e "s/-${V}-1\./\./")
            if [ "$alias" != "$file" ]; then
              cp "$file" "$alias"
              echo "$file -> $alias"
            fi
          done

      - name: Publish release
        uses: zxcloli666/release-helper@main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TYPE: ${{ github.event.inputs.version_type }}
          BUILD_COMMAND: "echo 'skip'"
          ASSET_PATTERNS: "/tmp/release/*"
          OPENAI_API_BASE_URL: ${{ secrets.AI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.AI_API_KEY }}
          OPENAI_API_MODEL: deep-think
          LANGUAGE: "РУССКИЙ"
          RELEASE_BANNER: |



            ---

      - name: Resolve published tag
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.version.outputs.version }}
        run: |
          for T in "$V" "v$V"; do
            if [ "$(gh release view "$T" --json isDraft -q .isDraft 2>/dev/null)" = "false" ]; then
              echo "tag=$T" >> "$GITHUB_OUTPUT"
              break
            fi
          done

  publish-aur:
    needs: [version, release]
    if: ${{ needs.release.result == 'success' && needs.release.outputs.tag != '' }}
    uses: ./.github/workflows/aur-publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  publish-flatpak-repo:
    needs: [flatpak, release]
    if: ${{ needs.release.outputs.tag != '' && needs.flatpak.outputs.repo == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: flatpak-repo
          path: site/flatpak

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
