name: voice-s2

on:
  push:
    branches: [voice/s2]
  workflow_dispatch:

jobs:
  sonora:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: utils/voice
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Test files
        run: |
          mkdir -p .cache/music .cache/speech
          curl -fsSL -o .cache/music/wildthing.wav "https://archive.org/download/AngrySamoansReturnTo/Angry%20Samoans%20-%2009%20-%20Wild%20Thing.wav"
          for n in 120 connected fresh_snow ice_on_roads rain speed_warning thunderstorm; do
            curl -fsSL -o .cache/speech/$n.wav "https://raw.githubusercontent.com/zxcloli666/CarUI/HEAD/audio/loli/$n.wav"
          done
      - name: Build
        run: cargo build --release -p voice-audio --example aec_bench
      - name: Test
        run: cargo test --release -p voice-audio
      - name: Bench
        run: |
          B=./target/release/examples/aec_bench
          E=sonora
          STRESS="--delays 120 --rt60 0.6 --esr 10 --drift -1000,-500,500,1000"
          LONG="--delays 120 --rt60 0.6 --esr 10 --drift 0,-200,-1000 --seconds 180 --music-offset 0"
          run() { echo "### $*"; $B --engine $E "$@"; }
          run
          run --steer
          run --rate 16000
          run --rate 16000 --steer
          run --ns
          run $STRESS
          run $STRESS --steer
          run $LONG
          run $LONG --steer
          run --delays 200 --rt60 0.6 --esr 0,10 --drift 0

  webrtc:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    defaults:
      run:
        shell: bash
        working-directory: utils/voice
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build tools
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ninja-build clang pkg-config python3-pip && pip3 install meson; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install meson ninja pkg-config; fi
          if [ "$RUNNER_OS" = "Windows" ]; then pip install meson ninja; fi
      - name: Test files
        run: |
          mkdir -p .cache/music .cache/speech
          curl -fsSL -o .cache/music/wildthing.wav "https://archive.org/download/AngrySamoansReturnTo/Angry%20Samoans%20-%2009%20-%20Wild%20Thing.wav"
          for n in 120 connected fresh_snow ice_on_roads rain speed_warning thunderstorm; do
            curl -fsSL -o .cache/speech/$n.wav "https://raw.githubusercontent.com/zxcloli666/CarUI/HEAD/audio/loli/$n.wav"
          done
      - name: Build
        env:
          CC: ${{ runner.os == 'Windows' && 'cl' || '' }}
          CXX: ${{ runner.os == 'Windows' && 'cl' || '' }}
        run: cargo build --release -p voice-audio --example aec_bench --features webrtc
      - name: Bench
        run: |
          B=./target/release/examples/aec_bench
          E=webrtc
          STRESS="--delays 120 --rt60 0.6 --esr 10 --drift -1000,-500,500,1000"
          LONG="--delays 120 --rt60 0.6 --esr 10 --drift 0,-200,-1000 --seconds 180 --music-offset 0"
          run() { echo "### $*"; $B --engine $E "$@"; }
          run
          run --steer
          run --rate 16000
          run --ns
          run $STRESS
          run $STRESS --steer
          run $LONG
          run $LONG --steer
          run --delays 200 --rt60 0.6 --esr 0,10 --drift 0
