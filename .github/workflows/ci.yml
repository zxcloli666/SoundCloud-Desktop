name: CI

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'utils/**'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/ci-mtime.sh'
      - 'scripts/ci-toolchain.sh'
      - '.github/scripts/changes.sh'
      - '.github/actions/target-cache/**'
      - '.github/actions/apt-packages/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'utils/**'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/ci-mtime.sh'
      - 'scripts/ci-toolchain.sh'
      - '.github/scripts/changes.sh'
      - '.github/actions/target-cache/**'
      - '.github/actions/apt-packages/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      rust: ${{ steps.changes.outputs.rust }}
      real: ${{ steps.changes.outputs.real }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: .github/scripts/changes.sh

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome lint src/

      - name: Colour scheme
        run: node scripts/check-scheme.mjs

      - name: Types and bundle
        run: pnpm build

  rust:
    name: Rust ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-packages
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev cmake clang libclang-dev pkg-config
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: System packages
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool

      - name: Toolchain
        working-directory: .
        run: bash scripts/ci-toolchain.sh

      - name: Restore targets
        uses: ./.github/actions/target-cache
        with:
          mode: restore
          name: ci-${{ matrix.os }}

      - name: Frontend placeholder
        run: mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html

      - name: Build tests
        id: build
        run: cargo test --no-run

      - name: Stamp
        if: always()
        working-directory: .
        env:
          BUILD: ${{ steps.build.outcome }}
        run: bash scripts/ci-mtime.sh stamp "$BUILD"

      - name: Tests
        if: runner.os != 'Windows'
        run: cargo test

      - name: Save targets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/target-cache
        with:
          mode: save
          name: ci-${{ matrix.os }}

  real-crates:
    name: Real call and decrypt-client crates
    needs: changes
    if: needs.changes.outputs.real == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        uses: ./.github/actions/apt-packages
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev protobuf-compiler cmake clang libclang-dev pkg-config
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Toolchain
        working-directory: .
        run: bash scripts/ci-toolchain.sh

      - name: Restore targets
        uses: ./.github/actions/target-cache
        with:
          mode: restore
          name: real-crates

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/SoundCloud-Internal
          token: ${{ secrets.INTERNAL_PAT }}
          path: _internal
          sparse-checkout: |
            call
            decrypt-client

      - name: Real crates
        working-directory: .
        run: |
          rm -rf utils/call utils/decrypt-client
          mv _internal/call _internal/decrypt-client utils/

      - name: Frontend placeholder
        run: mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html

      - name: Check
        id: build
        run: cargo check --all-targets

      - name: Stamp
        if: always()
        working-directory: .
        env:
          BUILD: ${{ steps.build.outcome }}
        run: bash scripts/ci-mtime.sh stamp "$BUILD"

      - name: Save targets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/target-cache
        with:
          mode: save
          name: real-crates
