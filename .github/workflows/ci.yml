name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['themes/**']
  pull_request:
    branches: [main]
    paths-ignore: ['themes/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome lint src/

      - name: Types and bundle
        run: pnpm build

  rust:
    name: Rust ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev cmake clang libclang-dev pkg-config

      - name: System packages
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ci-${{ matrix.os }}

      - name: Frontend placeholder
        run: mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html

      - name: Tests
        if: runner.os != 'Windows'
        run: cargo test

      - name: Tests compile
        if: runner.os == 'Windows'
        run: cargo test --no-run

  real-crates:
    name: Real call and decrypt-client crates
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/SoundCloud-Internal
          token: ${{ secrets.INTERNAL_PAT }}
          path: _internal
          sparse-checkout: |
            call
            decrypt-client

      - name: Real crates
        working-directory: .
        run: |
          rm -rf utils/call utils/decrypt-client
          mv _internal/call _internal/decrypt-client utils/

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev protobuf-compiler cmake clang libclang-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: real-crates

      - name: Frontend placeholder
        run: mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html

      - name: Check
        run: cargo check --all-targets
