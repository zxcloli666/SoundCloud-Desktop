name: CI

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'utils/**'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/ci-mtime.sh'
      - 'scripts/ci-toolchain.sh'
      - '.github/scripts/changes.sh'
      - '.github/actions/target-cache/**'
      - '.github/actions/apt-packages/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'utils/**'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/ci-mtime.sh'
      - 'scripts/ci-toolchain.sh'
      - '.github/scripts/changes.sh'
      - '.github/actions/target-cache/**'
      - '.github/actions/apt-packages/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      rust: ${{ steps.changes.outputs.rust }}
      real: ${{ steps.changes.outputs.real }}
      voice: ${{ steps.changes.outputs.voice }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: .github/scripts/changes.sh

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome lint src/

      - name: Colour scheme
        run: node scripts/check-scheme.mjs

      - name: Node tests
        run: node --experimental-strip-types --test 'src/**/*.test.mjs' 'tests/*.test.ts'

      - name: Types and bundle
        run: pnpm build

  rust:
    name: Rust ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: SeaweedFS
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          printf '%s' '{"identities":[{"name":"test","credentials":[{"accessKey":"UPTESTAK","secretKey":"UPTESTSECRET"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > "$RUNNER_TEMP/s3.json"
          docker run -d --name seaweed -p 8333:8333 -v "$RUNNER_TEMP/s3.json:/etc/seaweedfs/s3.json:ro" \
            mirror.gcr.io/chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d \
            server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -master.volumeSizeLimitMB=64 > /dev/null

      - name: System packages
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-packages
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev cmake clang libclang-dev pkg-config
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: System packages
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool

      - name: Toolchain
        working-directory: .
        run: bash scripts/ci-toolchain.sh

      - name: Restore targets
        uses: ./.github/actions/target-cache
        with:
          mode: restore
          name: ci-${{ matrix.os }}

      - name: Frontend placeholder
        run: mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html

      - name: Build tests
        id: build
        run: cargo test --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/build.json"

      - name: Stamp
        if: always()
        working-directory: .
        env:
          BUILD: ${{ steps.build.outcome }}
        run: bash scripts/ci-mtime.sh stamp "$BUILD"

      - name: Common controls manifest
        if: runner.os == 'Windows'
        run: |
          jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null) | .executable' "$RUNNER_TEMP/build.json" | while read -r exe; do
            cat > "$(cygpath -u "$exe").manifest" <<'XML'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <dependency>
              <dependentAssembly>
                <assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*"/>
              </dependentAssembly>
            </dependency>
          </assembly>
          XML
            echo "manifest for $(basename "$exe")"
          done

      - name: Tests
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            cargo test --lib --bins --tests
          else
            cargo test
          fi

      - name: Boosty card
        working-directory: utils/boosty-card
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/src-tauri/target
        run: cargo test

      - name: Other volume
        if: runner.os == 'Windows'
        env:
          CHAT_OTHER_VOLUME: ${{ runner.temp }}
        run: cargo test --lib -- --ignored --exact chat::relocate::tests::a_folder_on_a_real_other_volume_is_copied_verified_and_then_removed

      - name: SeaweedFS tests
        if: runner.os == 'Linux'
        env:
          CHAT_SEAWEED: 127.0.0.1:8333
        run: |
          timeout 120 sh -c 'until curl -s -o /dev/null http://127.0.0.1:8333/; do sleep 1; done'
          echo 's3.bucket.create -name scd-chat' | docker exec -i seaweed weed shell > /dev/null
          cargo test --lib -- --ignored chat::upload::tests::seaweed

      - name: Chat lab build
        if: runner.os == 'Linux'
        run: |
          grep -q '^chat-lab = ' Cargo.toml || { echo "no chat-lab feature yet"; exit 0; }
          cargo test --no-run --features chat-lab

      - name: Save targets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/target-cache
        with:
          mode: save
          name: ci-${{ matrix.os }}

  voice:
    name: Voice crates
    needs: changes
    if: needs.changes.outputs.voice == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: utils/voice
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        uses: ./.github/actions/apt-packages
        with:
          packages: libasound2-dev clang libclang-dev pkg-config
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Toolchain
        working-directory: .
        run: bash scripts/ci-toolchain.sh

      - name: Restore targets
        uses: ./.github/actions/target-cache
        with:
          mode: restore
          name: voice
          target: utils/voice/target
          lock: utils/voice/Cargo.lock

      - name: Build tests
        id: build
        run: cargo test --workspace --release --no-run

      - name: Stamp
        if: always()
        working-directory: .
        env:
          BUILD: ${{ steps.build.outcome }}
        run: bash scripts/ci-mtime.sh stamp "$BUILD"

      - name: Tests
        run: cargo test --workspace --release --no-fail-fast

      - name: Save targets
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/target-cache
        with:
          mode: save
          name: voice
          target: utils/voice/target
          lock: utils/voice/Cargo.lock

  real-crates:
    name: Real call and decrypt-client crates
    needs: changes
    if: needs.changes.outputs.real == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        uses: ./.github/actions/apt-packages
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev protobuf-compiler cmake clang libclang-dev pkg-config
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Toolchain
        working-directory: .
        run: bash scripts/ci-toolchain.sh

      - name: Restore targets
        uses: ./.github/actions/target-cache
        with:
          mode: restore
          name: real-crates

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/SoundCloud-Internal
          token: ${{ secrets.INTERNAL_PAT }}
          path: _internal
          sparse-checkout: |
            call
            decrypt-client

      - name: Real crates
        working-directory: .
        run: |
          rm -rf utils/call utils/decrypt-client
          mv _internal/call _internal/decrypt-client utils/

      - name: Frontend placeholder
        run: mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html

      - name: Check
        id: build
        run: cargo check --all-targets

      - name: Stamp
        if: always()
        working-directory: .
        env:
          BUILD: ${{ steps.build.outcome }}
        run: bash scripts/ci-mtime.sh stamp "$BUILD"

      - name: Save targets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/target-cache
        with:
          mode: save
          name: real-crates
