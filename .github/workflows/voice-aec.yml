name: voice-aec

on:
  push:
    branches: [voice/aec]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  engine:
    name: Engine crate ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: utils/voice
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev cmake clang libclang-dev pkg-config

      - name: Toolchain
        working-directory: .
        run: bash scripts/ci-toolchain.sh

      - name: Models and audio
        env:
          PYTHONUTF8: "1"
        run: |
          B=https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models
          V=sherpa-onnx-streaming-zipformer-small-ru-vosk-int8-2025-08-16
          mkdir -p .cache/store/silero-vad/1 .cache/store/$V/1 .cache/audio .cache/hot .cache/dl
          curl -sSL -o .cache/store/silero-vad/1/silero_vad.onnx $B/silero_vad.onnx
          curl -sSL -o .cache/dl/vosk.tar.bz2 $B/$V.tar.bz2
          tar xjf .cache/dl/vosk.tar.bz2 -C .cache/dl
          for f in encoder.int8.onnx decoder.onnx joiner.int8.onnx tokens.txt bpe.model; do cp .cache/dl/$V/$f .cache/store/$V/1/; done
          pip install -q sentencepiece
          python -c "
          import sentencepiece as s
          sp=s.SentencePieceProcessor(model_file='.cache/store/$V/1/bpe.model')
          open('.cache/store/$V/1/bpe.vocab','w',newline='\n').write(''.join(f'{sp.id_to_piece(i)}\t{sp.get_score(i)}\n' for i in range(sp.get_piece_size())))
          "
          curl -sSL -o .cache/audio/100.wav https://raw.githubusercontent.com/zxcloli666/CarUI/main/audio/loli/100.wav
          ls -l .cache/store/*/1

      - name: Test
        run: cargo test --release -p voice-engine -- --nocapture 2>&1 | grep -E "^test |skipped|test result|panicked|heard"
