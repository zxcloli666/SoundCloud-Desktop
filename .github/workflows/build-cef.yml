name: Build (CEF / Chromium)

# Экспериментальная кроссплатформенная CEF-сборка десктопа (рендер через Chromium
# вместо системного webview). Опт-ин фича `cef` (ветка tauri feat/cef). Бандлинг
# libcef + ресурсов Chromium делает tauri-cli ВЕТКИ (`cargo tauri build -f cef`):
#   Linux  → .deb / .rpm / .AppImage (libcef рядом с бинарём внутри пакета)
#   Windows→ .exe (nsis) / .msi (libcef.dll + ресурсы рядом)
#   macOS  → .app / .dmg (Chromium Embedded Framework.framework + helper-бандлы)
# Отдельный воркфлоу — основной Release не трогает. Ручной запуск или тег cef-*.
#
# Валидировано локально на Linux (.deb/.rpm с libcef корректны). Windows/macOS —
# тот же бандлер ветки, но на CI ещё не прогонялись: первый workflow_dispatch и есть
# их проверка.
on:
  workflow_dispatch:
  push:
    tags: ["cef-*"]

permissions:
  contents: read

concurrency:
  group: build-cef-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: ubuntu-22.04,   target: "",                     os_key: linux-x64 }
          - { platform: windows-latest, target: "",                     os_key: windows-x64 }
          - { platform: macos-latest,   target: aarch64-apple-darwin,   os_key: macos-arm64 }
    runs-on: ${{ matrix.platform }}
    env:
      HAS_INTERNAL_PAT: ${{ secrets.INTERNAL_PAT != '' }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev protobuf-compiler file

      - name: System deps (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: System deps (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y --no-progress

      - name: Checkout internal repo (when PAT present)
        if: ${{ env.HAS_INTERNAL_PAT == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/SoundCloud-Internal
          token: ${{ secrets.INTERNAL_PAT }}
          path: _internal

      - name: Replace mock crates with real (unix)
        if: ${{ env.HAS_INTERNAL_PAT == 'true' && runner.os != 'Windows' }}
        run: |
          rm -rf utils/call utils/decrypt-client
          cp -r _internal/call ./utils/call
          cp -r _internal/decrypt-client ./utils/decrypt-client

      - name: Replace mock crates with real (windows)
        if: ${{ env.HAS_INTERNAL_PAT == 'true' && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force utils/call, utils/decrypt-client
          Copy-Item -Recurse _internal/call ./utils/call
          Copy-Item -Recurse _internal/decrypt-client ./utils/decrypt-client

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: cef-${{ matrix.os_key }}

      # tauri-cli ветки feat/cef (умеет бандлить CEF). Компиляция ~10 мин — кэшируем
      # бинарь; обновить = бамп ключа -v1 → -v2.
      - name: Cache tauri-cli (feat/cef)
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-feat-cef-${{ runner.os }}-v1

      - name: Install tauri-cli (feat/cef)
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/tauri-apps/tauri --branch feat/cef tauri-cli

      - name: Install frontend deps
        run: pnpm -C desktop install --frozen-lockfile

      - name: Build frontend (prod dist)
        run: pnpm -C desktop build

      # Фаза 1: cargo build качает CEF SDK в OUT_DIR (версия-в-версию с крейтом cef).
      - name: Build CEF binary (download SDK)
        run: cargo build --release --features cef ${{ matrix.target && format('--target {0}', matrix.target) || '' }} --manifest-path desktop/src-tauri/Cargo.toml

      # Фаза 2: указываем бандлеру скачанный CEF (CEF_PATH) и пакуем.
      - name: Bundle (unix)
        if: runner.os != 'Windows'
        working-directory: desktop
        run: |
          CEF_PATH=$(find src-tauri/target -type d -path '*cef-dll-sys*/out/cef_*' | head -1)
          [ -n "$CEF_PATH" ] || { echo "::error::CEF dir не найден"; exit 1; }
          echo "CEF_PATH=$CEF_PATH"
          export CEF_PATH
          cargo tauri build -f cef ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Bundle (windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          $cef = Get-ChildItem -Recurse -Directory src-tauri/target |
            Where-Object { $_.FullName -match 'cef-dll-sys' -and $_.Name -like 'cef_*' } |
            Select-Object -First 1
          if (-not $cef) { Write-Error "CEF dir не найден"; exit 1 }
          $env:CEF_PATH = $cef.FullName
          echo "CEF_PATH=$env:CEF_PATH"
          cargo tauri build -f cef

      - uses: actions/upload-artifact@v4
        with:
          name: soundcloud-desktop-cef-${{ matrix.os_key }}
          path: |
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
            desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/macos/*.app
          retention-days: 7
          if-no-files-found: warn
