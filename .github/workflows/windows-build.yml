name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/windows-cloud-build
    paths:
      - "desktop/**"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: windows-x64

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Generate Sonveil application icons
        working-directory: desktop
        run: pnpm exec tauri icon src/assets/sonveil-app-icon.png

      - name: Check frontend types
        working-directory: desktop
        run: pnpm exec tsc --noEmit

      - name: Lint frontend
        working-directory: desktop
        run: pnpm exec biome lint src

      - name: Run frontend regression tests
        working-directory: desktop
        run: pnpm test

      - name: Run Rust unit tests
        working-directory: desktop/src-tauri
        run: cargo test --lib

      - name: Build portable executable
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: desktop
          args: --no-bundle

      - name: Prepare portable executable
        shell: pwsh
        run: |
          $source = "desktop/src-tauri/target/release/soundcloud-desktop.exe"
          $destination = "desktop/src-tauri/target/release/bundle/portable"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Built executable was not found: $source"
          }
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item -LiteralPath $source -Destination "$destination/Sonveil-portable.exe"

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: Sonveil-portable-windows-x64
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          path: desktop/src-tauri/target/release/bundle/portable/Sonveil-portable.exe
