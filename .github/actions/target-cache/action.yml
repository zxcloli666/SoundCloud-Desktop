name: target-cache
description: Restore or save the debug target dir of one CI job as a zstd tar in the public ghcr package cache/desktop-ci

inputs:
  mode:
    description: restore or save
    required: true
  name:
    description: Snapshot name, one per job and OS
    required: true
  target:
    description: Cargo target directory
    default: desktop/src-tauri/target
  lock:
    description: Cargo.lock that picks the exact tag
    default: desktop/src-tauri/Cargo.lock
  token:
    description: Token that may push packages
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: oras-project/setup-oras@v2
      with:
        version: 1.3.4

    - name: Restore
      if: inputs.mode == 'restore'
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        TARGET: ${{ inputs.target }}
        LOCK: ${{ inputs.lock }}
      run: |
        cd "$GITHUB_WORKSPACE"
        owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
        repo=ghcr.io/$owner/cache/desktop-ci
        toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
        exact=$NAME-$toolchain-$(git rev-parse "HEAD:$LOCK" | cut -c1-12)
        pack=$RUNNER_TEMP/target-cache
        mkdir -p "$pack"
        for tag in "$exact" "$NAME-latest"; do
          oras pull "$repo:$tag" --output "$pack" > /dev/null 2>&1 || continue
          if zstd -dc "$pack/target.tar.zst" | tar -xf -; then
            echo "restored $repo:$tag ($(du -sh "$pack/target.tar.zst" | cut -f1))"
            bash scripts/ci-mtime.sh restore
          else
            rm -rf "$TARGET" .ci
            echo "::warning::$repo:$tag did not unpack, building cold"
          fi
          rm -rf "$pack"
          exit 0
        done
        echo "no snapshot for $NAME in $repo, building cold"

    - name: Save
      if: inputs.mode == 'save'
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        TARGET: ${{ inputs.target }}
        LOCK: ${{ inputs.lock }}
        TOKEN: ${{ inputs.token }}
      run: |
        cd "$GITHUB_WORKSPACE"
        if [ ! -f .ci/sha ]; then
          echo "build failed, nothing saved"
          exit 0
        fi
        owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
        repo=ghcr.io/$owner/cache/desktop-ci
        toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
        exact=$NAME-$toolchain-$(git rev-parse "HEAD:$LOCK" | cut -c1-12)
        find "$TARGET" -type f -size +20M ! -path '*/build/*' \( -name '*.exe' -o -name '*.pdb' -o \( -perm -u+x ! -name '*.*' \) \) -delete
        pack=$RUNNER_TEMP/target-cache
        mkdir -p "$pack"
        tar -cf - .ci "$TARGET" | zstd -q -T0 -3 -o "$pack/target.tar.zst"
        echo "target.tar.zst is $(du -sh "$pack/target.tar.zst" | cut -f1)"
        printf '%s' "$TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        cd "$pack"
        oras push "$repo:$exact,$NAME-latest" target.tar.zst:application/zstd \
          --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" > /dev/null
        echo "pushed $repo:$exact"
        rm -rf "$pack"
