[package]
name = "voice-audio"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
webrtc = ["dep:webrtc-audio-processing"]

[dependencies]
cpal = "0.17"
rubato = "0.16"
serde_json = "1"
sonora = "0.2.0"
webrtc-audio-processing = { version = "2", optional = true, features = ["bundled"] }

[dev-dependencies]
hound = "3"
rand = "0.9"
rustfft = "6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-core-foundation = "0.3"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "AudioHardwareDeprecated", "objc2", "objc2-foundation"] }
