[package]
name = "soundcloud-desktop"
version = "8.4.10"
description = "Sonveil desktop music player"
authors = ["SoundCloud Desktop contributors"]
edition = "2024"

[lib]
name = "soundcloud_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Пин на версию ветки feat/cef — иначе cargo берёт более свежую crates.io (без фичи cef).
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
tauri = { version = "=2.11.2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time", "process"] }
warp = "0.3"
discord-rich-presence = "1"
tauri-plugin-http = "2.5.7"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["rustls-tls", "stream", "json", "socks"], default-features = false }
futures-util = "0.3"
http = "1"
urlencoding = "2"
tauri-plugin-single-instance = "2.4.0"
rodio = { version = "0.22.2", features = ["mp3", "symphonia-aac", "symphonia-isomp4", "symphonia-ogg"] }
cpal = "0.17"
biquad = "0.5"
rustfft = { version = "6", default-features = false }
souvlaki = "0.8"
raw-window-handle = "0.6"
tauri-plugin-dialog = "2.7.0"
ogg = "0.9.2"
audiopus = "0.2.0"
chrono = { version = "0.4", features = ["clock"] }
libc = "0.2"
url = "2"
regex = { version = "1", default-features = false, features = ["std"] }
bytes = "1"
tracing = "0.1"
ffmpeg-sidecar = "2.5.2"
if-addrs = "0.15"

[features]
# Opt-in: рендер через CEF (Chromium) вместо wry/webkitgtk. Требует [patch.crates-io] ниже.
# Дефолтная сборка (без этой фичи) остаётся на wry.
cef = ["tauri/cef"]

[profile.release]
lto = true

# Экспериментальная ветка Tauri с рантаймом tauri-runtime-cef и фичей `cef`.
# Патчим ТОЛЬКО `tauri` (одна крейта на весь граф → плагины с crates.io разделяют
# тот же рантайм) и `tauri-build` (наш build-dep, пин на версию ветки). Внутренние
# tauri-* (tauri-runtime/utils/macros/codegen/plugin) git-tauri тянет по path сам;
# отдельно их НЕ патчим — иначе build-script'ы crates.io-плагинов ловят skew
# версий schemars (tauri-plugin::global_scope_schema).
[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }
tauri-build = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.5", default-features = false, features = ["tokio"] }
