[package]
name = "soundcloud-desktop"
version = "8.8.0"
description = "Beautiful Soundcloud Desktop app"
authors = ["zxcloli666"]
edition = "2024"

[lib]
name = "soundcloud_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
dirs = "6"
tauri-plugin-fs = "2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time", "process", "sync"] }
warp = "0.3"
discord-rich-presence = "1"
tauri-plugin-http = "2.8.3"
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
sc-fingerprint = { git = "https://github.com/zxcloli666/SoundCloud-Backend", tag = "v9.9.1" }
backend-contracts = { git = "https://github.com/zxcloli666/SoundCloud-Backend", tag = "v9.9.1" }
wreq = { version = "0.16.1", features = ["json", "query", "stream", "gzip", "brotli", "deflate", "zstd", "charset", "socks", "multipart"] }
futures-util = "0.3"
http = "1"
tower = { version = "0.5", default-features = false }
hyper-util = { version = "0.1", features = ["client-proxy", "client-proxy-system"] }
urlencoding = "2"
tauri-plugin-single-instance = "2.5.4"
rodio = { version = "0.22.2", features = ["mp3", "symphonia-aac", "symphonia-isomp4", "symphonia-ogg"] }
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm"] }
cpal = "0.17"
biquad = "0.5"
signalsmith-stretch = "0.1.3"
rustfft = { version = "6", default-features = false }
souvlaki = "0.8"
raw-window-handle = "0.6"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-updater = "2.14.0"
ogg = "0.9.2"
audiopus = "0.2.0"
chrono = { version = "0.4", features = ["clock"] }
libc = "0.2"
url = "2"
regex = { version = "1", default-features = false, features = ["std"] }
bytes = "1"
call-client = { path = "../../utils/call/client" }
decrypt-client = { path = "../../utils/decrypt-client" }
ffmpeg-sidecar = "2.5.2"
if-addrs = "0.15"
uuid = { version = "1", features = ["v4"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = true

[profile.dev.package.signalsmith-stretch]
opt-level = 3

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Diagnostics_ToolHelp", "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSURL"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.5", default-features = false, features = ["tokio"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
